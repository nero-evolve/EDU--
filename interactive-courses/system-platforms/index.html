<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf6fa">
  <title>系統平臺探險隊｜資訊科技教材站</title>
  <meta name="description" content="以任務和小遊戲自學系統平臺：電腦硬體、作業系統、記憶體、新興平臺與雲端服務。">
  <link rel="icon" href="../../favicon.ico">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="../../" aria-label="回資訊科技教材站首頁"><span class="brand-mark">OS</span><span><b>系統平臺探險隊</b><small>數位城市維修任務</small></span></a>
      <div class="top-actions"><a class="home-link" href="../../">教材首頁</a><button id="reset" class="quiet-button" type="button">重新開始</button></div>
    </header>
    <div id="status" class="status" role="status" aria-live="polite">進度儲存在這個瀏覽器。</div>
    <main id="app" tabindex="-1"><noscript>這個課程需要開啟 JavaScript 才能遊玩。</noscript></main>
    <footer><span>資訊科技教材站</span><span>作者：林暐昇老師</span><details><summary>延伸資料</summary><ul>
      <li><a href="https://csrc.nist.gov/pubs/sp/800/145/final" target="_blank" rel="noreferrer">NIST：雲端運算定義與服務模式</a></li>
      <li><a href="https://source.android.com/docs/core/architecture/kernel" target="_blank" rel="noreferrer">Android 開放原始碼計畫：Linux 核心</a></li>
      <li><a href="https://docs.arduino.cc/tutorials/uno-rev3/board-anatomy/" target="_blank" rel="noreferrer">Arduino 官方文件：開發板結構</a></li>
      <li><a href="https://support.microsoft.com/en-us/windows/experience/storage-filemanagement/defragment-optimize-your-data-drives-in-windows" target="_blank" rel="noreferrer">Microsoft：HDD 與 SSD 的磁碟最佳化</a></li>
      <li><a href="https://support.microsoft.com/en-us/windows/security/windows-security/firewall-and-network-protection-in-the-windows-security-app" target="_blank" rel="noreferrer">Microsoft：Windows 防火牆與網路保護</a></li>
      <li><a href="https://opensource.org/osd" target="_blank" rel="noreferrer">Open Source Initiative：開放原始碼定義</a></li>
    </ul><p>課程概念依康軒「認識系統平臺」與「新興系統平臺」簡報整理；補充說明以官方文件為準。</p></details></footer>
  </div>
  <script>
    function showCourseError(message) {
      const app = document.querySelector('#app');
      const panel = document.createElement('section');
      panel.className = 'load-error';
      const title = document.createElement('h2');
      title.textContent = '課程內容沒有載入';
      const detail = document.createElement('p');
      detail.textContent = message;
      const steps = document.createElement('p');
      steps.textContent = '請確認 GitHub 的 interactive-courses/system-platforms 資料夾內有 index.html、style.css 和 course.js，並重新整理網站。';
      panel.append(title, detail, steps);
      app.replaceChildren(panel);
      document.querySelector('#status').textContent = '課程程式載入失敗。';
    }
    window.addEventListener('error', event => {
      if (event.target === window) showCourseError(`程式錯誤：${event.message}`);
    });
  </script>
  <script src="./course.js?v=20261117-render-fix" defer onerror="showCourseError('找不到 course.js，請確認它已上傳到這個課程資料夾。')"></script>
</body>
</html>
